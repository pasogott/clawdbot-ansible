---
# Linux-specific system tools installation (apt-based)

- name: Check for populated apt package lists
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: '*_Packages*'
  register: openclaw_apt_package_lists

- name: Install essential system tools (Linux - apt)
  ansible.builtin.apt:
    name:
      # Editors
      - vim
      - nano
      # Version control
      - git
      - git-lfs
      # Network tools
      - curl
      - wget
      - netcat-openbsd
      - net-tools
      - dnsutils
      - iputils-ping
      - traceroute
      - tcpdump
      - nmap
      - socat
      - telnet
      # Debugging tools
      - strace
      - lsof
      - gdb
      - htop
      - iotop
      - iftop
      - sysstat
      - procps
      # System utilities
      - tmux
      - tree
      - jq
      - unzip
      - rsync
      - less
      - sudo
      # Build essentials for development
      - build-essential
      - file
    state: present
    update_cache: true
    # Clean container images can have a recent lists directory with no package indexes.
    cache_valid_time: "{{ 3600 if openclaw_apt_package_lists.matched > 0 else 0 }}"

- name: Deploy global vim configuration (Linux)
  ansible.builtin.template:
    src: vimrc.j2
    dest: /etc/vim/vimrc.local
    owner: root
    group: root
    mode: '0644'
